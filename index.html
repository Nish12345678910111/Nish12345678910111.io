<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>modern chat by Nishgamerr</title>
    <script type="module" src="https://cdn.skypack.dev/@supabase/supabase-js@2"></script>
    <style>
        body { background: #071127; color: #e6eef8; font-family: Inter, system-ui, sans-serif; display: flex; justify-content: center; padding: 18px; }
        .wrap { width: 100%; max-width: 720px; }
        h2 { margin: 0 0 8px 0; color: #60a5fa; }
        .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; flex-wrap: wrap; }
        #currentUsername { color: #94a3b8; font-size: 0.95rem; }
        #username { background: #0f1724; color: #e6eef8; border: 1px solid #1f2937; padding: 6px 8px; border-radius: 6px; width: 48%; max-width: 320px; }
        #chat { background: #071127; border-radius: 8px; padding: 12px; height: 420px; overflow-y: auto; border: 1px solid #132033; }
        .message { display: flex; margin-bottom: 10px; width: 100%; }
        .msg-content-bubble { padding: 6px 10px; border-radius: 12px; max-width: 70%; display: flex; flex-direction: column; font-size: 0.95rem; }
        .my-message { justify-content: flex-end; } .other-message { justify-content: flex-start; }
        .my-message .msg-content-bubble { background: #1d4ed8; } .other-message .msg-content-bubble { background: #1f2937; }
        .username { color: #d1d5db; font-weight: 700; margin-bottom: 4px; font-size: 0.85rem; }
        .text { color: #e6eef8; white-space: pre-wrap; line-height: 1.35; word-break: break-word; }
        .bubble-footer { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 4px; font-size: 0.82rem; }
        .ts { color: #d1ddff; } .status-online { color: #16a34a; } .status-off { color: #dc2626; }
        #controls { display: flex; gap: 8px; margin-top: 10px; }
        #messageInput { flex: 1; padding: 10px; border-radius: 8px; background: #0f1724; color: #e6eef8; border: 1px solid #1f2937; }
        #sendBtn { padding: 10px 14px; background: #2563eb; border: none; border-radius: 8px; color: #fff; cursor: pointer; }
        .smallBtn { padding: 6px 8px; border-radius: 6px; border: none; background: #1f2937; color: #e6eef8; cursor: pointer; font-size: 0.85rem; }
        #controls2 { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
        #errorBox { margin-top: 8px; color: #fecaca; min-height: 1.2em; }
        #dbDot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-left: 8px; background: #dc2626; }
        .card { background: #071127; padding: 12px; border-radius: 8px; border: 1px solid #132033; width: 420px; max-width: 95%; color: #e6eef8; max-height: 80vh; overflow-y: auto; }
        #modal, #profileModal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.6); z-index: 60; }
        .user-item { padding: 8px; border-bottom: 1px solid #1f2937; display: flex; justify-content: space-between; }
        #usersList { max-height: 300px; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="wrap">
        <div style="display:flex;justify-content:space-between;align-items:center;">
            <h2>modern chat by Nishgamerr</h2>
            <div><span id="dbDot" title="DB status"></span></div>
        </div>
        <div class="top">
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                <span id="currentUsername">Username: Guest</span>
                <input id="username" placeholder="Enter username" autocomplete="off" />
                <button id="saveName" class="smallBtn">Save</button>
            </div>
        </div>
        <div id="chat" role="log" aria-live="polite"></div>
        <div id="controls">
            <input id="messageInput" placeholder="Type a message" />
            <button id="sendBtn">Send</button>
        </div>
        <div id="controls2">
            <button id="autoScrollBtn" class="smallBtn">Auto Scroll: ON</button>
            <button id="profileBtn" class="smallBtn">Profile</button>
            <button id="deleteAllBtn" class="smallBtn">Delete All Mine</button>
            <button id="passwordBtn" class="smallBtn">Password</button>
        </div>
        <div id="errorBox"></div>
    </div>

    <div id="modal" aria-hidden="true"><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;"><strong id="modalTitle">Password</strong><button id="modalClose" class="smallBtn">Close</button></div><div style="margin-top:8px;"><div id="modalMsg" style="color:#9aa3b2;margin-bottom:8px"></div><div id="loginForm" style="display:none;"><div class="row"><input id="loginPw" type="password" placeholder="Enter password" style="width:100%;padding:8px;border-radius:6px;background:#0f1724;border:1px solid #1f2937;color:#e6eef8" /></div><div class="actions"><button id="loginBtn" class="smallBtn">Login</button></div></div><div id="setForm" style="display:none;"><div class="row"><input id="setPw" type="password" placeholder="New password" style="width:100%;padding:8px;border-radius:6px;background:#0f1724;border:1px solid #1f2937;color:#e6eef8" /></div><div class="row"><input id="setPwConfirm" type="password" placeholder="Confirm password" style="width:100%;padding:8px;border-radius:6px;background:#0f1724;border:1px solid #1f2937;color:#e6eef8" /></div><div class="actions"><button id="setSaveBtn" class="smallBtn">Save</button><button id="setSkipBtn" class="smallBtn">Skip</button></div></div></div></div></div>
    <div id="profileModal"><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;"><strong>Users</strong><button id="profileClose" class="smallBtn">×</button></div><div style="margin-top:8px;"><input id="searchInput" placeholder="Search users" style="width:100%;padding:8px;border-radius:6px;background:#0f1724;border:1px solid #1f2937;color:#e6eef8;margin-bottom:8px" /><div id="usersList"></div></div></div></div>

    <script type="module">
        import { createClient } from 'https://cdn.skypack.dev/@supabase/supabase-js@2';
        const SUPABASE_URL = 'https://xvnbxdcqmfsnnvbugasi.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_OQbzgO3ZE6-6qDl1YT_fXA_LA5aM-f0';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const chatEl = document.getElementById('chat');
        const usernameEl = document.getElementById('username');
        const currentUsernameLabel = document.getElementById('currentUsername');
        const saveNameBtn = document.getElementById('saveName');
        const deleteAllBtn = document.getElementById('deleteAllBtn');
        const autoScrollBtn = document.getElementById('autoScrollBtn');
        const profileBtn = document.getElementById('profileBtn');
        const sendBtn = document.getElementById('sendBtn');
        const messageInput = document.getElementById('messageInput');
        const errorBox = document.getElementById('errorBox');
        const dbDot = document.getElementById('dbDot');
        const passwordBtn = document.getElementById('passwordBtn');
        const modal = document.getElementById('modal');
        const modalClose = document.getElementById('modalClose');
        const profileModal = document.getElementById('profileModal');
        const profileClose = document.getElementById('profileClose');
        const searchInput = document.getElementById('searchInput');
        const usersList = document.getElementById('usersList');

        const DEVICE_KEY = 'chat_device_id_v5';
        let deviceId = localStorage.getItem(DEVICE_KEY);
        if (!deviceId) { deviceId = crypto.randomUUID(); localStorage.setItem(DEVICE_KEY, deviceId); }
        let autoScroll = true;
        let loggedAs = localStorage.getItem('chat_logged_as') || null;

        /* === HANDSHAKE (Find Empty or Create New with Random ID) === */
        async function initiateHandshake() {
            try {
                console.log('[Handshake] Checking for available rows...');
                
                // 1. Fetch first 50 rows
                const { data: rows, error } = await supabase
                    .from('user_ips')
                    .select('id, request')
                    .order('id', { ascending: true })
                    .limit(50);

                if (error) throw error;

                // 2. Find first row with empty request
                let targetRow = null;
                if (rows) {
                    for (const r of rows) {
                        if (!r.request) { targetRow = r; break; }
                    }
                }

                let rowId;

                // 3. Logic: Use existing or Create New
                if (targetRow) {
                    rowId = targetRow.id;
                    console.log(`[Handshake] Found empty row ID: ${rowId}`);
                } else {
                    console.log('[Handshake] No empty rows. Creating new row with Random ID...');
                    
                    // Generate Random UUID for ID
                    const randomId = crypto.randomUUID();
                    
                    // Attempt insert with random ID
                    let insertData = { id: randomId, request: 'requesting' };
                    
                    // If table uses bigserial (int), providing UUID might fail. 
                    // We try with UUID first, if fail, try without ID column.
                    let result = await supabase.from('user_ips').insert(insertData).select('id').single();
                    
                    if (result.error) {
                        console.warn('[Handshake] Random ID insert failed, trying auto-generated ID...');
                        result = await supabase.from('user_ips').insert({ request: 'requesting' }).select('id').single();
                    }

                    if (result.error || !result.data) {
                        console.error('[Handshake] Failed to create row:', result.error);
                        return;
                    }
                    
                    rowId = result.data.id;
                    console.log(`[Handshake] Created new row ID: ${rowId}`);
                }

                // 4. Set Requesting (if using existing row, we need to update it)
                if (targetRow) {
                    await supabase.from('user_ips').update({ request: 'requesting' }).eq('id', rowId);
                }

                // 5. Wait for OK
                const startTime = Date.now();
                const timeoutMs = 20000;
                let success = false;

                const checkInterval = setInterval(async () => {
                    const elapsed = Date.now() - startTime;
                    const { data: checkRow } = await supabase.from('user_ips').select('request').eq('id', rowId).single();

                    if (checkRow && checkRow.request === 'ok') {
                        clearInterval(checkInterval);
                        console.log('[Handshake] OK received!');
                        success = true;
                        await supabase.from('user_ips').update({ request: null }).eq('id', rowId);
                    } else if (elapsed > timeoutMs) {
                        clearInterval(checkInterval);
                        if (!success) {
                            console.warn('[Handshake] Timeout! Setting offline.');
                            // Set offline silently (no popup)
                            await supabase.from('user_ips').update({ status: 'offline', current_username: 'timebot-down', request: null }).eq('id', rowId);
                        }
                    }
                }, 1000);

            } catch (err) {
                console.error('[Handshake] Error:', err);
            }
        }

        /* === CORE FUNCTIONS === */
        async function loadMessages() {
            try {
                const { data } = await supabase.from('messages').select('*').order('created_at', { ascending: true });
                chatEl.innerHTML = '';
                if (data) data.forEach(renderRow);
                dbDot.style.background = '#16a34a';
            } catch (e) { dbDot.style.background = '#dc2626'; }
        }
        
        function renderRow(row) {
            const wrapper = document.createElement('div');
            wrapper.className = 'message ' + (row.username === loggedAs ? 'my-message' : 'other-message');
            const bubble = document.createElement('div');
            bubble.className = 'msg-content-bubble';
            const u = document.createElement('div'); u.className = 'username'; u.textContent = row.username;
            const t = document.createElement('div'); t.className = 'text'; t.textContent = row.content;
            const footer = document.createElement('div'); footer.className = 'bubble-footer';
            const ts = document.createElement('span'); ts.className = 'ts'; ts.textContent = new Date(row.created_at).toLocaleTimeString();
            footer.appendChild(ts);
            bubble.appendChild(u); bubble.appendChild(t); bubble.appendChild(footer);
            wrapper.appendChild(bubble);
            chatEl.appendChild(wrapper);
            if(autoScroll) chatEl.scrollTop = chatEl.scrollHeight;
        }

        async function sendMessage() {
            const txt = messageInput.value.trim();
            if(!txt) return;
            messageInput.value = '';
            const name = loggedAs || 'Guest';
            await supabase.from('messages').insert({ username: name, content: txt, device_id: deviceId });
        }
        
        // Simple implementation of other features
        saveNameBtn.onclick = async () => {
            const name = usernameEl.value.trim();
            if(!name) return;
            loggedAs = name;
            localStorage.setItem('chat_logged_as', name);
            currentUsernameLabel.textContent = 'Username: ' + name;
            await supabase.from('user_ips').update({ current_username: name, status: 'online' }).eq('id', 37574);
            // Basic password logic omitted for brevity, handled by modals if needed
        };
        
        sendBtn.onclick = sendMessage;
        messageInput.onkeydown = (e) => { if(e.key === 'Enter' && !e.shiftKey) sendMessage(); };
        autoScrollBtn.onclick = () => { autoScroll = !autoScroll; autoScrollBtn.textContent = `Auto Scroll: ${autoScroll ? 'ON' : 'OFF'}`; };
        profileBtn.onclick = async () => { profileModal.style.display = 'flex'; const { data } = await supabase.from('user_ips').select('current_username, status'); usersList.innerHTML = ''; (data||[]).forEach(u => { if(u.current_username){ const d=document.createElement('div'); d.className='user-item'; d.innerHTML=`<span>${u.current_username}</span><span class="${u.status==='online'?'status-online':'status-off'}">${u.status||'offline'}</span>`; usersList.appendChild(d); } }); };
        profileClose.onclick = () => profileModal.style.display = 'none';
        modalClose.onclick = () => modal.style.display = 'none';
        deleteAllBtn.onclick = async () => { if(confirm('Delete all?')) await supabase.from('messages').delete().eq('username', loggedAs); loadMessages(); };
        passwordBtn.onclick = () => { modal.style.display = 'flex'; };

        // Subscriptions
        supabase.channel('chat').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (p) => renderRow(p.new)).subscribe();

        // Init
        (async () => {
            // Check Session
            if (loggedAs) { usernameEl.value = loggedAs; currentUsernameLabel.textContent = 'Username: ' + loggedAs; }
            
            // Start Handshake
            initiateHandshake();
            
            // Load
            await loadMessages();
        })();
    </script>
</body>
</html>
